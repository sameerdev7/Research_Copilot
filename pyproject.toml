[project]
name = "research-copilot"
version = "0.1.0"
description = "Multi-agent research assistant: arXiv search, RAG ingestion, self-correcting query answering"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "google-genai>=1.0",
    "django-htmx>=1.19",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
