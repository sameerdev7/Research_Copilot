{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Research Copilot{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between">
        <a href="{% url 'workspace-list' %}" class="font-semibold">Research Copilot</a>
        {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="post" class="inline">
                {% csrf_token %}
                <span class="text-slate-300 mr-3 text-sm">{{ user.username }}</span>
                <button type="submit" class="text-slate-300 hover:text-white text-sm">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="text-slate-300 hover:text-white text-sm">Log in</a>
        {% endif %}
    </nav>
    <main class="max-w-4xl mx-auto px-6 py-8">
        {% for message in messages %}
            <div class="mb-4 px-4 py-2 rounded bg-amber-100 text-amber-900 text-sm">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
